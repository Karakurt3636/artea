<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Artea Etkinlik Takvimi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<meta name="description" content="Artea Atölye & Kafe etkinlik takvimi">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<style>
:root{
  --bg:#f6efe4; --card:#fffaf2; --ink:#2f2a24; --muted:#8a7f72; --line:#e6dccb;
  --accent:#b5502f; --accent-soft:#f3d9cc; --olive:#6d7a47;
  --c-workshop:#b5502f; --c-etkinlik:#6d7a47; --c-kampanya:#c8963e; --c-ozel:#7a5c8a; --c-not:#5f7f8c;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'DM Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:1100px;margin:0 auto;padding:20px 16px 48px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-family:'Fraunces',serif;font-weight:700;font-size:30px;letter-spacing:.02em}
.brand small{display:block;font-family:'DM Sans';font-weight:500;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
button{font:inherit;cursor:pointer}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 14px;font-size:14px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.year{display:flex;align-items:center;gap:6px;font-family:'Fraunces',serif;font-size:20px;font-weight:700}
.year button{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--card);font-size:16px}
.months{display:flex;gap:6px;overflow-x:auto;padding:16px 0 6px;scrollbar-width:none}
.months::-webkit-scrollbar{display:none}
.mtab{flex:0 0 auto;border:1px solid var(--line);background:transparent;border-radius:999px;padding:7px 14px;font-size:14px;color:var(--muted);position:relative}
.mtab.on{background:var(--ink);border-color:var(--ink);color:#fff}
.mtab i{position:absolute;top:4px;right:6px;width:6px;height:6px;border-radius:50%;background:var(--accent)}
.layout{display:grid;grid-template-columns:1fr 340px;gap:20px;margin-top:10px;align-items:start}
.layout.clean{grid-template-columns:1fr}
.cal{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px}
.mtitle{font-family:'Fraunces',serif;font-size:34px;font-weight:700;margin:0 0 12px}
.mtitle span{color:var(--muted);font-weight:500;font-size:22px;margin-left:6px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dow{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:center;padding:4px 0}
.day{min-height:92px;border:1px solid var(--line);border-radius:12px;background:#fff;padding:6px;text-align:left;display:flex;flex-direction:column;gap:3px;overflow:hidden;color:inherit}
.day:hover{border-color:var(--accent)}
.day.empty{visibility:hidden}
.day.today .num{background:var(--accent);color:#fff}
.day.sel{outline:2px solid var(--accent);outline-offset:1px}
.day.we{background:#fbf6ec}
.num{font-size:13px;font-weight:700;width:24px;height:24px;border-radius:50%;display:grid;place-items:center}
.chip{font-size:11px;line-height:1.25;border-radius:6px;padding:2px 5px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.chips{display:contents}
.more{font-size:11px;color:var(--muted)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;position:sticky;top:12px}
.panel h3{font-family:'Fraunces',serif;margin:0 0 2px;font-size:22px}
.panel .sub{color:var(--muted);font-size:13px;margin-bottom:12px}
.note{display:flex;gap:10px;align-items:flex-start;padding:10px;border-radius:12px;background:#fff;border:1px solid var(--line);margin-bottom:8px}
.note .bar{width:5px;align-self:stretch;border-radius:3px;flex:0 0 5px}
.note .body{flex:1;font-size:14px;word-break:break-word}
.note .tm{font-weight:700;font-size:12px;color:var(--muted)}
.note .x{border:0;background:none;color:var(--muted);font-size:18px;line-height:1}
.note .x:hover{color:var(--accent)}
.form{display:grid;gap:8px;margin-top:12px;border-top:1px dashed var(--line);padding-top:12px}
.form .row{display:grid;grid-template-columns:110px 1fr;gap:8px}
input,select,textarea{font:inherit;font-size:14px;border:1px solid var(--line);border-radius:10px;padding:9px 10px;background:#fff;color:var(--ink);width:100%}
textarea{resize:vertical;min-height:70px}
.legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:14px;font-size:12px;color:var(--muted)}
.legend b{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.up{margin-top:16px;border-top:1px dashed var(--line);padding-top:12px}
.up h4{margin:0 0 8px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.upi{display:flex;gap:10px;font-size:13px;padding:5px 0;cursor:pointer}
.upi .d{flex:0 0 52px;font-weight:700}
.empty-msg{color:var(--muted);font-size:14px;padding:6px 0}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
.status{font-size:12px;color:var(--muted)}

.tabs{display:flex;gap:8px;margin-top:16px}
.tab{border:1px solid var(--line);background:transparent;border-radius:999px;padding:9px 20px;font-size:15px;font-weight:500;color:var(--muted)}
.tab.on{background:var(--accent);border-color:var(--accent);color:#fff}
.menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px;margin-top:18px}
.mcard{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px}
.mcard h3{font-family:'Fraunces',serif;font-size:26px;margin:0 0 8px;padding-bottom:10px;border-bottom:1.5px solid var(--line)}
.mi{padding:9px 0}
.mi .row{display:flex;align-items:baseline;gap:10px;font-size:17px}
.mi .nm{font-weight:500}
.mi .dots{flex:1;min-width:12px;border-bottom:2px dotted var(--line)}
.mi .pr{font-weight:700;color:var(--accent)}
.mi .ds{margin:3px 0 0;font-size:13px;line-height:1.5;color:var(--muted)}
.mnote{margin:12px 0 0;font-size:14px;font-weight:500}
.mcontact{display:flex;flex-direction:column;gap:6px;margin-top:14px;font-size:16px}
.mcontact a{color:var(--accent);font-weight:500}
@media(max-width:860px){
  .layout{grid-template-columns:1fr}
  .panel{position:static}
  .day{min-height:64px;padding:4px}
  .chips{display:flex;gap:3px;flex-wrap:wrap}
  .chip{font-size:0;width:10px;height:10px;padding:0;border-radius:50%}
  .day.has{background:var(--accent-soft);border-color:var(--accent)}
  .mtitle{font-size:28px}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">Artea<small>Atölye &amp; Kafe</small></div>
    <div class="tools" id="calTools">
      <div class="year"><button id="py" aria-label="Önceki yıl">‹</button><span id="yr"></span><button id="ny" aria-label="Sonraki yıl">›</button></div>
      <button class="btn" id="todayBtn">Bugün</button>
      <button class="btn" id="cleanBtn">Temiz görünüm</button>
      <button class="btn" id="adminBtn">Yönetici girişi</button>
    </div>
  </header>
  <nav class="tabs" aria-label="Sayfa bölümleri">
    <button class="tab on" id="tabCal" data-v="takvim">Takvim</button>
    <button class="tab" id="tabMenu" data-v="menu">Menü</button>
  </nav>
  <div id="viewCal">
  <div class="months" id="months"></div>
  <div class="layout" id="layout">
    <section class="cal">
      <h2 class="mtitle" id="mt"></h2>
      <div class="grid" id="grid"></div>
      <div class="legend" id="legend"></div>
      <div class="status" id="status" style="margin-top:10px"></div>
    </section>
    <aside class="panel" id="panel"></aside>
  </div>
  </div>
  <div id="viewMenu" style="display:none">
    <div class="menu" id="menuGrid"></div>
  </div>
</div>
<div class="toast" id="toast"></div>
<div id="login" style="display:none;position:fixed;inset:0;background:rgba(47,42,36,.5);place-items:center;z-index:10">
  <form id="loginForm" class="panel" style="position:static;width:min(340px,92vw)">
    <h3>Yönetici girişi</h3>
    <div class="sub">Sadece takvimi düzenleyen kişi için.</div>
    <div class="form" style="border:0;padding-top:0;margin-top:0">
      <input type="email" id="lemail" placeholder="E-posta" autocomplete="username" required>
      <input type="password" id="lpass" placeholder="Şifre" autocomplete="current-password" required>
      <button class="btn primary" type="submit">Giriş yap</button>
      <button class="btn" type="button" id="lcancel">Vazgeç</button>
    </div>
  </form>
</div>

<script>
const MONTHS=['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
const MSHORT=['Oca','Şub','Mar','Nis','May','Haz','Tem','Ağu','Eyl','Eki','Kas','Ara'];
const DOW=['Pzt','Sal','Çar','Per','Cum','Cmt','Paz'];
const CATS={workshop:['Workshop','--c-workshop'],etkinlik:['Etkinlik','--c-etkinlik'],kampanya:['Menü / Kampanya','--c-kampanya'],ozel:['Özel gün / Rezervasyon','--c-ozel'],not:['Not','--c-not']};
const catColor=k=>getComputedStyle(document.documentElement).getPropertyValue((CATS[k]||CATS.not)[1]).trim();

const now=new Date();
let year=now.getFullYear(), month=now.getMonth(), sel=null;
let events={};            // { 'YYYY-MM-DD': [ {id,t,time,cat} ] }
let sb=null, isAdmin=false, mode='demo';
const LS='artea-takvim-demo';

const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,'0');
const key=(y,m,d)=>`${y}-${pad(m+1)}-${pad(d)}`;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('on'),2200)}

function loadLocal(){try{const r=localStorage.getItem(LS);if(r)events=JSON.parse(r)||{}}catch(e){}}
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify(events))}catch(e){}}

function rowsToEvents(rows){
  const o={};
  rows.forEach(r=>{(o[r.day]=o[r.day]||[]).push({id:r.id,t:r.title,time:r.time||'',cat:r.cat||'not'})});
  return o;
}
async function fetchEvents(){
  const {data,error}=await sb.from('events').select('*').order('day');
  if(error){toast('Takvim yüklenemedi');return}
  events=rowsToEvents(data||[]); renderAll();
}
async function initBackend(){
  const cfg=window.ARTEA_CONFIG||{};
  if(!cfg.SUPABASE_URL||cfg.SUPABASE_URL.includes('BURAYA')||!window.supabase){
    mode='demo'; loadLocal(); renderAll(); renderStatus(); return;
  }
  mode='live';
  sb=window.supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_ANON_KEY);
  const {data}=await sb.auth.getSession();
  isAdmin=!!(data&&data.session);
  sb.auth.onAuthStateChange((_e,sess)=>{isAdmin=!!sess;renderAll();renderStatus()});
  await fetchEvents(); renderStatus();
}
function renderStatus(){
  $('adminBtn').textContent=isAdmin?'Çıkış yap':'Yönetici girişi';
  $('adminBtn').style.display=mode==='demo'?'none':'';
  $('status').textContent = mode==='demo'
    ? 'Deneme modu: veritabanı bağlı değil, notlar yalnızca bu tarayıcıda saklanıyor.'
    : (isAdmin?'Yönetici olarak giriş yaptın, notlar herkes için kaydedilir.':'');
}
const canEdit=()=>mode==='demo'||isAdmin;

/* ---------- render ---------- */
function renderYear(){ $('yr').textContent=year; }
function renderMonths(){
  $('months').innerHTML=MONTHS.map((m,i)=>{
    const has=Object.keys(events).some(k=>k.startsWith(`${year}-${pad(i+1)}-`));
    return `<button class="mtab ${i===month?'on':''}" data-m="${i}">${m}${has?'<i></i>':''}</button>`;
  }).join('');
  $('months').querySelectorAll('.mtab').forEach(b=>b.onclick=()=>{month=+b.dataset.m;sel=null;renderAll()});
}
function renderGrid(){
  $('mt').innerHTML=`${MONTHS[month]}<span>${year}</span>`;
  const first=new Date(year,month,1);
  const lead=(first.getDay()+6)%7;
  const dim=new Date(year,month+1,0).getDate();
  let h=DOW.map(d=>`<div class="dow">${d}</div>`).join('');
  for(let i=0;i<lead;i++) h+='<div class="day empty"></div>';
  const tk=key(now.getFullYear(),now.getMonth(),now.getDate());
  for(let d=1;d<=dim;d++){
    const k=key(year,month,d);
    const wd=(lead+d-1)%7;
    const items=(events[k]||[]).slice().sort((a,b)=>(a.time||'99').localeCompare(b.time||'99'));
    const chips=items.slice(0,3).map(e=>`<span class="chip" style="background:${catColor(e.cat)}">${e.time?esc(e.time)+' ':''}${esc(e.t)}</span>`).join('');
    const more=items.length>3?`<span class="more">+${items.length-3} daha</span>`:'';
    h+=`<button class="day ${k===tk?'today':''} ${k===sel?'sel':''} ${wd>=5?'we':''} ${items.length?'has':''}" data-k="${k}"><span class="num">${d}</span><span class="chips">${chips}</span>${more}</button>`;
  }
  $('grid').innerHTML=h;
  $('grid').querySelectorAll('.day[data-k]').forEach(b=>b.onclick=()=>{sel=b.dataset.k;renderGrid();renderPanel();if(window.innerWidth<=860)$('panel').scrollIntoView({behavior:'smooth',block:'start'})});
}
function fmtLong(k){
  const [y,m,d]=k.split('-').map(Number);
  const wd=['Pazar','Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi'][new Date(y,m-1,d).getDay()];
  return `${d} ${MONTHS[m-1]} ${y}, ${wd}`;
}
function upcoming(){
  const tk=key(now.getFullYear(),now.getMonth(),now.getDate());
  const out=[];
  Object.keys(events).sort().forEach(k=>{if(k>=tk)(events[k]||[]).forEach(e=>out.push({k,e}))});
  return out.slice(0,6);
}
function renderPanel(){
  const up=upcoming();
  const upHtml=`<div class="up"><h4>Yaklaşan etkinlikler</h4>${
    up.length?up.map(({k,e})=>{const [y,m,d]=k.split('-').map(Number);
      return `<div class="upi" data-k="${k}"><span class="d">${d} ${MSHORT[m-1]}</span><span>${esc(e.t)}</span></div>`}).join('')
    :'<div class="empty-msg">Henüz planlanmış etkinlik yok.</div>'}</div>`;
  if(!sel){
    $('panel').innerHTML=`<h3>Bir gün seç</h3><div class="sub">Takvimden bir güne tıkla, o günün etkinliklerini gör.</div>${upHtml}`;
  }else{
    const items=(events[sel]||[]).slice().sort((a,b)=>(a.time||'99').localeCompare(b.time||'99'));
    const list=items.length?items.map(e=>`
      <div class="note"><div class="bar" style="background:${catColor(e.cat)}"></div>
      <div class="body">${e.time?`<div class="tm">${esc(e.time)} · ${esc((CATS[e.cat]||CATS.not)[0])}</div>`:`<div class="tm">${esc((CATS[e.cat]||CATS.not)[0])}</div>`}${esc(e.t)}</div>
      ${canEdit()?`<button class="x" data-id="${e.id}" aria-label="Sil">×</button>`:''}</div>`).join('')
      :'<div class="empty-msg">Bu güne henüz not eklenmemiş.</div>';
    $('panel').innerHTML=`<h3>${fmtLong(sel).split(',')[0]}</h3><div class="sub">${fmtLong(sel).split(', ')[1]}</div>${list}
      ${canEdit()?`<div class="form">
        <div class="row"><input type="time" id="ftime" aria-label="Saat"><select id="fcat">${Object.entries(CATS).map(([k,v])=>`<option value="${k}">${v[0]}</option>`).join('')}</select></div>
        <textarea id="ftext" placeholder="Not / etkinlik… (örn. Makrome workshop, 6 kişi, 14:00)"></textarea>
        <button class="btn primary" id="fadd">Ekle</button>
      </div>`:''}${upHtml}`;
    if(canEdit()) $('fadd').onclick=addNote;
    $('panel').querySelectorAll('.x').forEach(b=>b.onclick=()=>delNote(b.dataset.id));
  }
  $('panel').querySelectorAll('.upi').forEach(r=>r.onclick=()=>{const [y,m]=r.dataset.k.split('-').map(Number);year=y;month=m-1;sel=r.dataset.k;renderAll()});
}
function renderLegend(){
  $('legend').innerHTML=Object.entries(CATS).map(([k,v])=>`<span><b style="background:${catColor(k)}"></b>${v[0]}</span>`).join('');
}
function renderAll(){renderYear();renderMonths();renderGrid();renderPanel();}

/* ---------- actions ---------- */
async function addNote(){
  const t=$('ftext').value.trim(); if(!t){toast('Önce bir not yaz');return}
  const time=$('ftime').value||'', cat=$('fcat').value;
  if(mode==='demo'){
    (events[sel]=events[sel]||[]).push({id:Date.now().toString(36),t,time,cat});
    saveLocal(); renderAll(); return;
  }
  const {error}=await sb.from('events').insert({day:sel,title:t,time,cat});
  if(error){toast('Kaydedilemedi: yetkin yok ya da bağlantı sorunu');return}
  await fetchEvents();
}
async function delNote(id){
  if(mode==='demo'){
    events[sel]=(events[sel]||[]).filter(e=>String(e.id)!==String(id));
    if(!events[sel].length) delete events[sel];
    saveLocal(); renderAll(); return;
  }
  const {error}=await sb.from('events').delete().eq('id',id);
  if(error){toast('Silinemedi');return}
  await fetchEvents();
}

/* ---------- controls ---------- */
$('py').onclick=()=>{year--;sel=null;renderAll()};
$('ny').onclick=()=>{year++;sel=null;renderAll()};
$('todayBtn').onclick=()=>{year=now.getFullYear();month=now.getMonth();sel=key(year,month,now.getDate());renderAll()};
$('cleanBtn').onclick=()=>{
  const c=$('layout').classList.toggle('clean');
  $('panel').style.display=c?'none':'';
  $('status').style.display=c?'none':'';
  $('cleanBtn').textContent=c?'Düzenleme görünümü':'Temiz görünüm';
  if(c) toast('Ekran görüntüsü almak için hazır');
};

$('adminBtn').onclick=async()=>{
  if(isAdmin){await sb.auth.signOut();toast('Çıkış yapıldı');return}
  $('login').style.display='grid';
};
$('lcancel').onclick=()=>{$('login').style.display='none'};
$('loginForm').onsubmit=async ev=>{
  ev.preventDefault();
  const {error}=await sb.auth.signInWithPassword({email:$('lemail').value.trim(),password:$('lpass').value});
  if(error){toast('Giriş başarısız');return}
  $('login').style.display='none'; $('lpass').value=''; toast('Hoş geldin');
};

/* ---------- menü ---------- */
const MENU=[
  {t:'Sıcak İçecekler',items:[['Çay','50'],['Türk Kahvesi','130']]},
  {t:'Soğuk İçecekler',items:[['Limonlu Soda','55'],['Çilekli Soda','55'],['Lipton Ice Tea','55'],['Tamek Ice Tea','55'],['Maden Suyu','40'],['Burn Enerji İçeceği','95']]},
  {t:'Heykel Boyama',items:[
    ['Küçük Boy','100','Kalp, yıldız, ayı, kardan adam, mumluk ve benzeri küçük figürler'],
    ['Orta Boy','200','Büstler, kartal figürü, küçük vazolar'],
    ['Büyük Boy','300','Kadın baş saksı, soyut vazolar ve büyük figürler']],
    note:'Boya ve fırça fiyata dahildir.'}
];
const EVENT_TEXT='Rahat, konforlu ve estetik bir ortamda düzenlemek istediğiniz etkinlikler için bizimle iletişime geçin.';
function renderMenu(){
  const cards=MENU.map(c=>`<section class="mcard"><h3>${esc(c.t)}</h3>${c.items.map(i=>`
    <div class="mi"><div class="row"><span class="nm">${esc(i[0])}</span><span class="dots"></span><span class="pr">${esc(i[1])} ₺</span></div>${i[2]?`<p class="ds">${esc(i[2])}</p>`:''}</div>`).join('')}${c.note?`<p class="mnote">${esc(c.note)}</p>`:''}</section>`).join('');
  const ev=`<section class="mcard"><h3>Atölye &amp; Etkinlik Mekanı</h3><p style="margin:10px 0 0;font-size:17px;line-height:1.6">${esc(EVENT_TEXT)}</p>
    <div class="mcontact"><a href="https://www.instagram.com/arteacafeworkshop/" target="_blank" rel="noopener">Instagram: arteacafeworkshop</a><a href="tel:+905340117904">0534 011 79 04</a></div></section>`;
  $('menuGrid').innerHTML=cards+ev;
}
function setView(v){
  const m=v==='menu';
  $('viewCal').style.display=m?'none':'';
  $('viewMenu').style.display=m?'':'none';
  $('calTools').style.display=m?'none':'';
  $('tabCal').classList.toggle('on',!m);
  $('tabMenu').classList.toggle('on',m);
  document.title=m?'Artea Menü':'Artea Etkinlik Takvimi';
  if(location.hash.slice(1)!==(m?'menu':'takvim')) history.replaceState(null,'',m?'#menu':'#takvim');
}
$('tabCal').onclick=()=>setView('takvim');
$('tabMenu').onclick=()=>setView('menu');
window.addEventListener('hashchange',()=>setView(location.hash==='#menu'?'menu':'takvim'));
renderMenu();
setView(location.hash==='#menu'?'menu':'takvim');
renderLegend(); renderAll(); renderStatus(); initBackend();
</script>
</body>
